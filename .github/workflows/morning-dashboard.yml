# Daily 08:00 IST: collect repo health (issues, PRs, branches, build/lint/test,
# npm audit) into dashboard.json and keep it as an artifact for 14 days.
# See scripts/collect-dashboard.mjs. A failing check is data, not a failed run.
name: Morning dashboard

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC = 08:00 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        continue-on-error: true
        run: npm ci
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-dashboard.mjs dashboard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: dashboard.json
          retention-days: 14
          if-no-files-found: warn
