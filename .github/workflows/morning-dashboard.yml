# Daily 08:00 IST: collect repo health (issues, PRs, branches, build/lint/test,
# npm audit) into dashboard.json and keep it as an artifact for 14 days.
# See scripts/collect-dashboard.mjs. A failing check is data, not a failed run.
name: Morning dashboard

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC = 08:00 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        continue-on-error: true
        run: npm ci
      # The pipeline lifecycle tests make a mock video with ffmpeg, which the
      # runner image doesn't have (without it tests 7-10 and 16.7 fail).
      - name: Install ffmpeg
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Collect
        # Secrets only here; the collector keeps them from the build/lint/test children.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DASH_SECRET: ${{ secrets.DASH_SECRET }}
        run: node scripts/collect-dashboard.mjs dashboard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: dashboard.json
          retention-days: 14
          if-no-files-found: warn
